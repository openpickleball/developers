<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 812" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How the pieces of OPEN fit together</title>
  <desc id="arch-desc">Players and organizers in a browser will use the Frontend web app (frontend repo, planned); that path is planned. Partners (apps, league platforms, clubs, tournaments) use Partner integrations: OAuth2 tokens, with the API planned. The Frontend web app will call the backend at /api/v1/ and /_allauth/, which is planned. Partner integrations call the backend at /oauth/ and /api/v1/. The Backend (Django) holds the API at /api/v1/, accounts at /_allauth/, and the admin; the match ledger, confirmation workflow, and audit log; and Celery workers and beat with the default, ratings, email, and webhooks queues. Inside the backend sits the Engine (Python package), for replay and live updates; it is imported in-process, which is planned. The backend uses three services: Postgres (ledger and all records), Valkey (cache and Celery broker), and an Email provider (Resend). Three notes follow. Rating spec (rating-spec repository): the official definition of the math. The engine implements a spec version, identified by its config version and config fingerprint. openpb.org: a static teaser from the frontend repository on GitHub Pages. It is live and calls no backend. Status page (status.openpb.org, planned): checks the backend from outside, so it stays up when the backend is down. Solid outlines and lines are implemented; dashed ones are planned.</desc>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path class="od-head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
