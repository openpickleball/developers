  <text class="od-text" x="570" y="40" text-anchor="middle">clubs, tournaments)</text>
  <line class="od-line od-planned" x1="190" y1="50" x2="190" y2="82" marker-end="url(#arch-arrow)"/>
  <line class="od-line" x1="570" y1="50" x2="570" y2="82" marker-end="url(#arch-arrow)"/>
  <rect class="od-box od-planned" x="60" y="84" width="260" height="74" rx="8"/>
  <text class="od-name" x="190" y="115" text-anchor="middle">Frontend web app</text>
  <text class="od-text" x="190" y="137" text-anchor="middle">(frontend repo, planned)</text>
  <rect class="od-box" x="440" y="84" width="260" height="74" rx="8"/>
