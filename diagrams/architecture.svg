  <text class="od-label" x="202" y="190">/api/v1/ and /_allauth/</text>
  <line class="od-line" x1="570" y1="158" x2="570" y2="212" marker-end="url(#arch-arrow)"/>
  <text class="od-label" x="582" y="190">/oauth/ and /api/v1/</text>
  <rect class="od-box od-group" x="20" y="214" width="720" height="214" rx="10"/>
  <text class="od-name" x="40" y="242">Backend (Django)</text>
  <text class="od-text" x="40" y="268">API at /api/v1/</text>
  <text class="od-text" x="168" y="268">accounts at /_allauth/</text>
  <text class="od-text" x="320" y="268">admin</text>
  <text class="od-text" x="40" y="290">match ledger, confirmation workflow, audit log</text>
  <text class="od-text" x="40" y="312">Celery workers and beat: default, ratings, email, webhooks queues</text>
  <line class="od-line od-planned" x1="170" y1="324" x2="170" y2="352" marker-end="url(#arch-arrow)"/>
  <text class="od-label" x="182" y="343">imported in-process, planned</text>
  <rect class="od-box od-inner" x="40" y="354" width="280" height="56" rx="8"/>
