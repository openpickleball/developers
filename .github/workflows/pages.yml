# Builds the site with --strict on every pull request and push to main.
# A push to main also deploys it to GitHub Pages (dev.openpb.org).
name: Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older build.
concurrency:
  group: pages-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# build is meant to be a required status check on main, so renaming the
# job must also update the main ruleset.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build feeds the deploy, so it restores no cache.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked
      - run: uv run mkdocs build --strict
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Deploys run one at a time and are never cancelled part way.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
